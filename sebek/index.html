<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התסריט הראשון של סבק - חוויה קולנועית</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cinematic-black: #050505;
            --letterbox-bg: #000000;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--cinematic-black);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden; /* נועל את גלילת הדף הכללית */
            user-select: none;
        }

        .font-cinema {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Letterboxing (פסים שחורים קבועים) */
        .letterbox {
            position: fixed;
            left: 0; right: 0; height: 12vh;
            background: var(--letterbox-bg);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
        .letterbox-top { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .letterbox-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); }

        /* אזור גלילה מרכזי (מותאם לטאץ') */
        .scroll-area {
            position: absolute;
            top: 12vh; /* מתחיל מתחת לפס העליון */
            bottom: 12vh; /* מסתיים מעל הפס התחתון */
            left: 0;
            right: 0;
            overflow-y: auto; /* מאפשר גלילה אנכית */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* החלקה חלקה בניידים */
            z-index: 20;
            display: flex;
            flex-direction: column;
        }
        
        .scroll-content {
            margin: auto; /* ממרכז תוכן קצר, ושומר על גלילה נכונה בתוכן ארוך */
            width: 100%;
            max-width: 64rem;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* עיצוב פס הגלילה */
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Film Grain */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 40;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.07;
            animation: grainShift 0.2s steps(2) infinite;
        }

        @keyframes grainShift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-1%, 1%); }
            100% { transform: translate(1%, -1%); }
        }

        /* Backgrounds */
        .scene-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background-size: cover;
            animation: breathe 15s ease-in-out infinite alternate;
        }
        
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.85) 90%, #000 100%);
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Animations */
        .reveal-text {
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: simpleFade 0.8s ease-in forwards;
        }
        @keyframes simpleFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Texts */
        .subtitle-text {
            color: #f1f5f9;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8), 0px 4px 15px rgba(0,0,0,0.5);
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            line-height: 1.5;
            font-weight: 300;
        }
        .glow-word { color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); font-weight: 700; }
        .glow-red { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); font-weight: 700; }

        /* Glass Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }
        .glass-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        .glass-btn:hover:not(:disabled)::before {
            left: 200%;
        }

        /* Quiz Buttons */
        .quiz-option {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
            transition: all 0.3s;
        }
        .quiz-option:hover:not(:disabled) {
            background: rgba(30, 41, 59, 0.9);
            border-color: #fbbf24;
            transform: scale(1.02);
        }
        .quiz-option.correct {
            background: rgba(22, 163, 74, 0.5);
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .quiz-option.wrong {
            background: rgba(220, 38, 38, 0.5);
            border-color: #f87171;
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.3);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>

        const quizQuestions = [
            {
                q: "מהי האקספוזיציה (מקום וזמן ההתרחשות) של הסיפור?",
                options: ["בוורשה, בחורף, לפני מלחמת העולם השנייה", "בתל אביב, בקיץ, בשנות ה-50", "בניו יורק, בחורף הקר, בזמן המלחמה"],
                answer: 0
            },
            {
                q: "מהו הקונפליקט הפנימי המרכזי שקורע את סבק מבפנים?",
                options: ["ההתלבטות האם להיות חבר של שימק או של אדק", "הנאמנות לחבריו ששילמו לו, מול הנאמנות לאביו החולה", "הפחד לספר לחברים שלו שהוא שונא מערבונים"],
                answer: 1
            },
            {
                q: "מהי נקודת השיא והמפנה בסיפור?",
                options: ["כשהחבורה מחליטה לתת את הכסף לסבק", "הוויכוח הסוער בו שימק קורא לסבק שקרן", "הווידוי של סבק: 'חיברתי תסריט, התסריט הראשון שלי'"],
                answer: 2
            },
            {
                q: "פירוש המילה 'מוסטנגים' כפי שמתאר אותה סבק הוא:",
                options: ["חבל מיוחד ללכידת חיות", "גרזן אינדיאני", "סוסי פרא"],
                answer: 2
            },
            {
                q: "איזה סוג סיום יש לסיפור, ומדוע?",
                options: ["סיום סגור - הבעיה נפתרה, החברים סלחו והחברות התחזקה.", "סיום פתוח - שימק עדיין כועס עליו.", "סיום פתוח - לא יודעים מה קרה לאבא של סבק."],
                answer: 0
            }
        ];

        // --- STATE & RENDER LOGIC ---
        let state = {
            viewMode: 'story', // 'story', 'edu-menu', 'edu-modal', 'quiz'
            currentScene: 0,
            activeEduId: null,
            quizIndex: 0,
            score: 0,
            selectedAnswer: null,
            quizCompleted: false
        };

        const DOM = {
            top: document.getElementById('letterbox-top'),
            bottom: document.getElementById('letterbox-bottom'),
            main: document.getElementById('main-content')
        };

        function triggerAnimation(selector) {
            const elements = document.querySelectorAll(selector);
            elements.forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; 
                el.style.animation = null; 
            });
        }

        function render() {
            if (state.viewMode === 'story') renderStory();
            else if (state.viewMode === 'edu-menu') renderEduMenu();
            else if (state.viewMode === 'edu-modal') renderEduModal();
            else if (state.viewMode === 'quiz') renderQuiz();
            
            triggerAnimation('.reveal-text');
            triggerAnimation('.fade-in');
        }

        // --- STORY VIEW ---
        function renderStory() {
            const scene = scenes[state.currentScene];
            
            DOM.top.innerHTML = scene.id > 0 ? `<div class="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50 fade-in">סצנה ${scene.id} מתוך 7</div>` : '';
            
            const btns = scene.choices.map(c => 
                `<button onclick="window.actions.nextScene('${c.next}')" class="glass-btn px-6 md:px-10 py-3 rounded-md font-cinema text-lg md:text-xl tracking-wide w-full md:w-auto uppercase">${c.text}</button>`
            ).join('');
            DOM.bottom.innerHTML = `<div class="flex flex-col md:flex-row gap-4 px-4 w-full justify-center max-w-3xl reveal-text" style="animation-delay: 1s">${btns}</div>`;

            const dialogue = scene.dialogue ? 
                `<div class="mt-8 text-xl md:text-3xl text-yellow-400 italic font-light text-center reveal-text drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)] w-full border-l-4 border-r-4 border-yellow-500/30 py-4 bg-black/40 rounded" style="animation-delay: 0.8s">${scene.dialogue}</div>` : '';

            DOM.main.innerHTML = `
                <div class="scene-bg" style="background: ${scene.bgGradient}"></div>
                <div class="vignette"></div>
                <div class="scroll-area w-full">
                    <div class="scroll-content text-center">
                        <div class="text-6xl md:text-8xl mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.2)] reveal-text" style="animation-delay: 0.1s">${scene.icon}</div>
                        <div class="text-yellow-500 font-cinema tracking-widest uppercase text-sm md:text-lg mb-2 reveal-text" style="animation-delay: 0.2s">${scene.subtitle}</div>
                        <h1 class="text-4xl md:text-6xl lg:text-7xl font-cinema font-bold text-center mb-8 text-white drop-shadow-[0_5px_15px_rgba(0,0,0,0.8)] reveal-text leading-tight" style="animation-delay: 0.4s">${scene.title}</h1>
                        <div class="subtitle-text text-center reveal-text w-full" style="animation-delay: 0.6s">${scene.text}</div>
                        ${dialogue}
                    </div>
                </div>
            `;
        }

        // --- MENU VIEW ---
        function renderEduMenu() {
            DOM.top.innerHTML = `<div class="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50 fade-in">DIRECTOR'S ROOM</div>`;
            DOM.bottom.innerHTML = `<button onclick="window.actions.restart()" class="text-gray-500 hover:text-white font-cinema tracking-widest uppercase transition-colors fade-in">צפה בסרט מחדש 🔄</button>`;

            let categoriesHTML = eduCategories.map((cat, idx) => `
                <div onclick="window.actions.openModal('${cat.id}')" class="glass-btn p-5 rounded-xl flex items-center gap-4 group cursor-pointer" style="animation: revealUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: ${idx * 0.1}s; opacity: 0; transform: translateY(20px)">
                    <div class="text-3xl md:text-4xl group-hover:scale-110 transition-transform">${cat.icon}</div>
                    <div class="text-right flex-1">
                        <h3 class="text-lg md:text-xl font-cinema font-bold text-white mb-1">${cat.title}</h3>
                        <p class="text-slate-400 text-xs md:text-sm">${cat.subtitle}</p>
                    </div>
                    <div class="text-slate-500 group-hover:text-yellow-400 transition-colors text-xl">←</div>
                </div>
            `).join('');

            DOM.main.innerHTML = `
                <div class="scene-bg" style="background: radial-gradient(circle at 50% 50%, #0f172a 0%, #000000 100%)"></div>
                <div class="vignette"></div>
                <div class="scroll-area w-full">
                    <div class="scroll-content text-center">
                        <div class="text-yellow-500 font-cinema tracking-widest uppercase text-lg mb-2 fade-in">מאחורי הקלעים</div>
                        <h2 class="text-4xl md:text-5xl font-cinema font-bold text-center mb-4 text-white fade-in">חדר העריכה של הבמאי</h2>
                        <p class="text-slate-300 mb-8 text-center text-base md:text-lg max-w-2xl fade-in">הסרט נגמר, אבל הלמידה רק מתחילה. <br/>חקרו את המושגים הספרותיים בתסריט, או בחנו את עצמכם.</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                            ${categoriesHTML}
                            
                            <div onclick="window.actions.startQuiz()" class="glass-btn p-5 rounded-xl flex items-center gap-4 group col-span-1 md:col-span-2 bg-yellow-900/20 hover:bg-yellow-900/40 border-yellow-500/30 cursor-pointer" style="animation: revealUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 0.5s; opacity: 0; transform: translateY(20px)">
                                <div class="text-3xl md:text-4xl group-hover:scale-110 transition-transform">🎯</div>
                                <div class="text-right flex-1">
                                    <h3 class="text-xl md:text-2xl font-cinema font-bold text-yellow-400 mb-1">מבחן בד - תרגול מושגים</h3>
                                    <p class="text-slate-300 text-xs md:text-sm">הפגנו את הידע שצברתם וענו על שאלות טריוויה מהעלילה</p>
                                </div>
                                <div class="text-yellow-500 group-hover:text-white transition-colors text-lg md:text-xl font-bold">התחל ←</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- MODAL VIEW ---
        function renderEduModal() {
            const edu = eduCategories.find(e => e.id === state.activeEduId);
            
            DOM.top.innerHTML = '';
            DOM.bottom.innerHTML = `<button onclick="window.actions.closeModal()" class="glass-btn px-6 md:px-10 py-3 rounded-md font-cinema text-lg md:text-xl uppercase tracking-widest reveal-text" style="animation-delay: 0.2s">חזור לחדר העריכה</button>`;

            DOM.main.innerHTML = `
                <div class="scene-bg" style="background: radial-gradient(circle at center, #1e293b 0%, #000000 100%)"></div>
                <div class="scroll-area w-full">
                    <div class="scroll-content text-center">
                        <div class="text-6xl mb-4 reveal-text" style="animation-delay: 0.1s">${edu.icon}</div>
                        <h2 class="text-3xl md:text-5xl font-cinema font-bold text-yellow-400 mb-2 reveal-text" style="animation-delay: 0.1s">${edu.title}</h2>
                        <div class="text-slate-400 tracking-widest uppercase mb-8 border-b border-slate-700 pb-6 w-full reveal-text" style="animation-delay: 0.1s">${edu.subtitle}</div>
                        
                        <div class="w-full reveal-text" style="animation-delay: 0.2s">
                            ${edu.content}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- QUIZ VIEW ---
        function renderQuiz() {
            if (state.quizCompleted) {
                DOM.top.innerHTML = `<div class="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50 fade-in">מבחן בד - סיכום</div>`;
                DOM.bottom.innerHTML = `<button onclick="window.actions.closeModal()" class="glass-btn px-6 md:px-10 py-3 rounded-md font-cinema text-lg md:text-xl uppercase tracking-widest fade-in">חזור לחדר העריכה</button>`;
                
                const isPerfect = state.score === quizQuestions.length;
                DOM.main.innerHTML = `
                    <div class="scene-bg" style="background: radial-gradient(circle at center, #3f000f 0%, #000000 100%)"></div>
                    <div class="vignette"></div>
                    <div class="scroll-area w-full">
                        <div class="scroll-content text-center fade-in">
                            <div class="text-6xl mb-6">🏆</div>
                            <h2 class="text-4xl md:text-5xl font-cinema font-bold text-yellow-400 mb-4">CUT! סיום צילומים!</h2>
                            <p class="text-2xl text-white mb-8">הציון שלכם: <span class="font-bold text-yellow-400">${state.score}</span> מתוך ${quizQuestions.length}</p>
                            <p class="text-slate-300 text-lg max-w-lg mx-auto text-center">
                                ${isPerfect ? "ביצוע ברמת אוסקר! אתם שולטים בכל המושגים הקולנועיים של הסיפור לחלוטין." : "עבודה טובה! חזרו ל'חדר הבמאי' כדי לרענן את הזיכרון על המושגים שנותרו."}
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            const q = quizQuestions[state.quizIndex];
            
            DOM.top.innerHTML = `<div class="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50 fade-in">שאלה ${state.quizIndex + 1} / ${quizQuestions.length}</div>`;
            DOM.bottom.innerHTML = `<button onclick="window.actions.closeModal()" class="text-gray-500 hover:text-white font-cinema tracking-widest uppercase transition-colors text-sm fade-in">צא מהמבחן ✕</button>`;

            let optionsHTML = q.options.map((opt, idx) => {
                let stateClass = "";
                if (state.selectedAnswer !== null) {
                    const isSelected = state.selectedAnswer === idx;
                    const isCorrect = idx === q.answer;
                    if (isSelected && isCorrect) stateClass = "correct";
                    else if (isSelected && !isCorrect) stateClass = "wrong";
                    else if (isCorrect) stateClass = "correct opacity-50"; 
                }
                const disabled = state.selectedAnswer !== null ? "disabled" : "";
                
                return `
                    <button onclick="window.actions.answerQuiz(${idx})" ${disabled} class="quiz-option w-full p-4 md:p-6 rounded-xl text-lg md:text-xl font-light ${stateClass}">
                        ${opt}
                    </button>
                `;
            }).join('');

            DOM.main.innerHTML = `
                <div class="scene-bg" style="background: radial-gradient(circle at center, #3f000f 0%, #000000 100%)"></div>
                <div class="vignette"></div>
                <div class="scroll-area w-full">
                    <div class="scroll-content text-center reveal-text" style="animation-duration: 0.5s">
                        <div class="text-yellow-500 font-cinema tracking-widest uppercase text-xl mb-6">אקשן! 🎬</div>
                        <h2 class="text-2xl md:text-4xl font-bold text-center mb-8 text-white drop-shadow-md leading-tight">${q.q}</h2>
                        <div class="w-full space-y-4">
                            ${optionsHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ACTIONS (Exposed to window) ---
        window.actions = {
            nextScene: (nextId) => {
                if (nextId === "END") state.viewMode = 'edu-menu';
                else state.currentScene = nextId;
                render();
            },
            restart: () => {
                state.viewMode = 'story';
                state.currentScene = 0;
                render();
            },
            openModal: (id) => {
                state.viewMode = 'edu-modal';
                state.activeEduId = id;
                render();
            },
            closeModal: () => {
                state.viewMode = 'edu-menu';
                state.activeEduId = null;
                render();
            },
            startQuiz: () => {
                state.viewMode = 'quiz';
                state.quizIndex = 0;
                state.score = 0;
                state.quizCompleted = false;
                state.selectedAnswer = null;
                render();
            },
            answerQuiz: (idx) => {
                if (state.selectedAnswer !== null) return;
                
                state.selectedAnswer = idx;
                if (idx === quizQuestions[state.quizIndex].answer) {
                    state.score++;
                }
                render(); // Show colors

                setTimeout(() => {
                    if (state.quizIndex + 1 < quizQuestions.length) {
                        state.quizIndex++;
                        state.selectedAnswer = null;
                    } else {
                        state.quizCompleted = true;
                    }
                    render(); // Next question
                }, 1800);
            }
        };

        // Initialize App
        render();

    </script>
</body>
</html>
