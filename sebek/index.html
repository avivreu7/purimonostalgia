<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <!-- React & ReactDOM -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cinematic-black: #050505;
            --letterbox-bg: #000000;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--cinematic-black);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        .font-cinema {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Letterboxing */
        .letterbox {
            position: fixed;
            left: 0;
            right: 0;
            height: 12vh;
            background: var(--letterbox-bg);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            transition: all 0.5s ease;
        }
        .letterbox-top { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .letterbox-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); }

        /* Film Grain */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 40;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.07;
            animation: grainShift 0.2s steps(2) infinite;
        }

        @keyframes grainShift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-1%, 1%); }
            100% { transform: translate(1%, -1%); }
        }

        /* Backgrounds & Vignette */
        .scene-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            animation: breathe 15s ease-in-out infinite alternate;
            transition: background 1.5s ease;
        }
        
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.85) 90%, #000 100%);
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Animations */
        .reveal-text {
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: simpleFade 0.8s ease-in forwards;
        }
        @keyframes simpleFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Text Styles */
        .subtitle-text {
            color: #f1f5f9;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8), 0px 4px 15px rgba(0,0,0,0.5);
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            line-height: 1.5;
            font-weight: 300;
        }

        /* Glass Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 255, 255, 0.1);
        }
        
        .glass-btn:hover::before {
            left: 200%;
        }

        /* Highlights */
        .glow-word { color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); font-weight: 700; }
        .glow-red { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); font-weight: 700; }

        /* Educational Modal / Scroll Area */
        .edu-scroll {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 15px;
            direction: rtl;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .edu-scroll::-webkit-scrollbar { width: 6px; }
        .edu-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

    </style>
</head>
<body>

                                <li><strong>שימק:</strong> היריב של סבק. מחפש לערער על מעמדו ולהפוך למנהיג בעצמו (תחרותי).</li>

        // Component: Render the Text with inner HTML support
        const CinematicText = ({ htmlString, trigger }) => {
            return (

                    className="subtitle-text text-center reveal-text mb-8 md:mb-12 max-w-4xl px-4"
                    style={{ animationDelay: '0.6s' }}
                    dangerouslySetInnerHTML={{ __html: htmlString.replace(/\n/g, '<br/>') }}
                />
            );
        };

        const App = () => {
            const [currentScene, setCurrentScene] = useState(0);
            const [animationKey, setAnimationKey] = useState(0);
            const [viewMode, setViewMode] = useState('story'); // 'story' | 'edu-menu' | 'edu-modal'
            const [activeEdu, setActiveEdu] = useState(null);

            const handleNext = (nextValue) => {
                setAnimationKey(prev => prev + 1);
                if (nextValue === "END") {
                    setViewMode('edu-menu');
                } else {
                    setCurrentScene(nextValue);
                }
            };

            const openEduModal = (category) => {
                setAnimationKey(prev => prev + 1);
                setActiveEdu(category);
                setViewMode('edu-modal');
            };

            const closeEduModal = () => {
                setAnimationKey(prev => prev + 1);
                setActiveEdu(null);
                setViewMode('edu-menu');
            };

            const restartExperience = () => {
                setAnimationKey(prev => prev + 1);
                setCurrentScene(0);
                setViewMode('story');
            };

            // --- RENDER: STORY VIEW ---
            if (viewMode === 'story') {
                const scene = scenes[currentScene];
                return (
                    <>
                        <div className="film-grain"></div>
                        <div className="letterbox letterbox-top">
                            {scene.id > 0 && (
                                <div className="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50">
                                    סצנה {scene.id} מתוך 7
                                </div>
                            )}
                        </div>
                        <div className="letterbox letterbox-bottom">
                            <div key={`btn-${animationKey}`} className="flex gap-4 px-4 w-full justify-center max-w-3xl reveal-text" style={{ animationDelay: '1.2s' }}>
                                {scene.choices.map((choice, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleNext(choice.next)}
                                        className="glass-btn px-6 md:px-10 py-3 rounded-md font-cinema text-lg md:text-xl tracking-wide flex-1 md:flex-none uppercase"
                                    >
                                        {choice.text}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <main className="flex-grow relative flex flex-col items-center justify-center overflow-hidden z-10 pt-[12vh] pb-[12vh]">
                            <div key={`bg-${currentScene}`} className="scene-bg" style={{ background: scene.bgGradient }}></div>
                            <div className="vignette"></div>

                            <div className="z-20 flex flex-col items-center w-full px-4 md:px-12">
                                <div key={`icon-${animationKey}`} className="text-6xl md:text-8xl mb-6 drop-shadow-[0_0_30px_rgba(255,255,255,0.2)] reveal-text" style={{ animationDelay: '0.1s' }}>
                                    {scene.icon}
                                </div>
                                <div key={`sub-${animationKey}`} className="text-yellow-500 font-cinema tracking-widest uppercase text-sm md:text-lg mb-2 reveal-text" style={{ animationDelay: '0.2s' }}>
                                    {scene.subtitle}
                                </div>
                                <h1 key={`title-${animationKey}`} className="text-4xl md:text-6xl lg:text-7xl font-cinema font-bold text-center mb-10 text-white drop-shadow-[0_5px_15px_rgba(0,0,0,0.8)] reveal-text leading-tight" style={{ animationDelay: '0.4s' }}>
                                    {scene.title}
                                </h1>
                                <CinematicText htmlString={scene.text} trigger={animationKey} />
                                {scene.dialogue && (
                                    <div key={`dialogue-${animationKey}`} className="mt-2 text-xl md:text-3xl text-yellow-400 italic font-light text-center reveal-text drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)] max-w-4xl px-4 border-l-4 border-r-4 border-yellow-500/30 py-2 bg-black/30" style={{ animationDelay: '0.9s' }}>
                                        {scene.dialogue}
                                    </div>
                                )}
                            </div>
                        </main>
                    </>
                );
            }

            // --- RENDER: EDUCATIONAL HUB (MENU) ---
            if (viewMode === 'edu-menu') {
                return (
                    <>
                        <div className="film-grain"></div>
                        <div className="letterbox letterbox-top">
                            <div className="text-gray-500 font-cinema tracking-[0.2em] text-sm opacity-50">DIRECTOR's ROOM</div>
                        </div>
                        <div className="letterbox letterbox-bottom">
                            <button onClick={restartExperience} className="text-gray-500 hover:text-white font-cinema tracking-widest uppercase transition-colors">
                                צפה בסרט מחדש 🔄
                            </button>
                        </div>

                        <main className="flex-grow relative flex flex-col items-center justify-center overflow-hidden z-10 pt-[12vh] pb-[12vh]">
                            <div className="scene-bg" style={{ background: "radial-gradient(circle at 50% 50%, #0f172a 0%, #000000 100%)" }}></div>
                            <div className="vignette"></div>

                            <div className="z-20 flex flex-col items-center w-full px-4 max-w-5xl fade-in" key={animationKey}>
                                <div className="text-yellow-500 font-cinema tracking-widest uppercase text-lg mb-2">מאחורי הקלעים</div>
                                <h2 className="text-4xl md:text-5xl font-cinema font-bold text-center mb-4 text-white">חדר העריכה של הבמאי</h2>
                                <p className="text-slate-300 mb-12 text-center text-lg max-w-2xl">
                                    הסרט נגמר, אבל הלמידה רק מתחילה. בחרו את אחת מהתיקיות כדי לחקור את המושגים הספרותיים והמסרים שמסתתרים בתסריט.
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                                    {eduCategories.map((category, idx) => (
                                        <div 
                                            key={category.id}
                                            onClick={() => openEduModal(category)}
                                            className="glass-btn p-6 rounded-xl flex items-center gap-6 group"
                                            style={{ animation: `revealUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards`, animationDelay: `${idx * 0.15}s`, opacity: 0, transform: 'translateY(20px)' }}
                                        >
                                            <div className="text-5xl group-hover:scale-110 transition-transform">{category.icon}</div>
                                            <div className="text-right flex-1">
                                                <h3 className="text-2xl font-cinema font-bold text-white mb-1">{category.title}</h3>
                                                <p className="text-slate-400 text-sm">{category.subtitle}</p>
                                            </div>
                                            <div className="text-slate-500 group-hover:text-yellow-400 transition-colors text-2xl">←</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </>
                );
            }

            // --- RENDER: EDUCATIONAL HUB (MODAL DETAIL) ---
            if (viewMode === 'edu-modal' && activeEdu) {
                return (
                    <>
                        <div className="film-grain"></div>
                        <div className="letterbox letterbox-top"></div>
                        <div className="letterbox letterbox-bottom">
                            <button onClick={closeEduModal} className="glass-btn px-10 py-3 rounded-md font-cinema text-xl uppercase tracking-widest reveal-text" style={{ animationDelay: '0.4s' }}>
                                חזור לחדר העריכה
                            </button>
                        </div>

                        <main className="flex-grow relative flex flex-col items-center justify-center overflow-hidden z-10 pt-[12vh] pb-[12vh]">
                            <div className="scene-bg" style={{ background: "radial-gradient(circle at center, #1e293b 0%, #000000 100%)" }}></div>
                            
                            <div className="z-20 w-full max-w-4xl px-4 flex flex-col h-full py-8 fade-in" key={animationKey}>
                                <div className="text-center mb-8 border-b border-slate-700 pb-6 reveal-text" style={{ animationDelay: '0.1s' }}>
                                    <div className="text-6xl mb-4">{activeEdu.icon}</div>
                                    <h2 className="text-3xl md:text-5xl font-cinema font-bold text-yellow-400 mb-2">{activeEdu.title}</h2>
                                    <div className="text-slate-400 tracking-widest uppercase">{activeEdu.subtitle}</div>
                                </div>

                                <div className="flex-grow edu-scroll reveal-text" style={{ animationDelay: '0.3s' }}>
                                    {activeEdu.content}
                                </div>
                            </div>
                        </main>
                    </>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
