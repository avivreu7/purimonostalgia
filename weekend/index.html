<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפתק שלי לסיכום השבוע</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-color: #4CAF50;
            --whatsapp-color: #25D366;
            --whatsapp-hover: #128C7E;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .app-container {
            background-color: white; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 30px; width: 100%; max-width: 450px; text-align: center;
        }

        h1 { color: var(--primary-color); font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; font-size: 15px; }

        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
        }
        textarea { min-height: 120px; resize: vertical; }

        .color-selector { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
        .color-option {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s;
        }
        .color-option.selected { border-color: #333; transform: scale(1.1); }
        
        .color-yellow { background-color: #fffacd; }
        .color-pink   { background-color: #ffb6c1; }
        .color-blue   { background-color: #add8e6; }
        .color-green  { background-color: #98fb98; }
        .color-orange { background-color: #ffe4b5; }

        .btn-whatsapp {
            background-color: var(--whatsapp-color); color: white; border: none; padding: 15px;
            width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-whatsapp:hover { background-color: var(--whatsapp-hover); }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>הפתק שלי 📝</h1>
        <p>מלאו את הפרטים ושלחו למורה בוואטסאפ בלחיצת כפתור!</p>

        <div class="form-group">
            <label>איך קוראים לך?</label>
            <input type="text" id="studentName" placeholder="שם פרטי ומשפחה" required>
        </div>

        <div class="form-group">
            <label>בחר/י את צבע הפתק:</label>
            <div class="color-selector">
                <div class="color-option color-yellow selected" data-color="#fffacd"></div>
                <div class="color-option color-pink" data-color="#ffb6c1"></div>
                <div class="color-option color-blue" data-color="#add8e6"></div>
                <div class="color-option color-green" data-color="#98fb98"></div>
                <div class="color-option color-orange" data-color="#ffe4b5"></div>
            </div>
        </div>

        <div class="form-group">
            <label>סיכום השבוע שלי:</label>
            <textarea id="noteText" placeholder="מה למדתי השבוע? מה היה כיף?" required></textarea>
        </div>

        <button class="btn-whatsapp" onclick="sendToWhatsApp()">
            <i class="fab fa-whatsapp"></i> שלח למורה בוואטסאפ
        </button>
    </div>

    <script>
        let selectedColor = '#fffacd';

        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.getAttribute('data-color');
            });
        });

        function sendToWhatsApp() {
            const name = document.getElementById('studentName').value.trim();
            const text = document.getElementById('noteText').value.trim();

            if (!name || !text) {
                alert('אנא מלאו את השם ואת תוכן הפתק.');
                return;
            }

            // יצירת התבנית המובנית שהמורה תוכל להדביק
            const message = `🌟 הפתק שלי 🌟\nשם: ${name}\nצבע: ${selectedColor}\nתוכן: ${text}\n`;
            
            // מספר הטלפון של המורה (לדוגמה: 972501234567). אם ריק, יפתח רשימת אנשי קשר.
            const teacherPhoneNumber = ""; 
            const whatsappUrl = `https://wa.me/${teacherPhoneNumber}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
