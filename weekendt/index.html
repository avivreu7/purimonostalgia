<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח סיכום שבועי - מורה</title>
    <!-- פונטים מיוחדים למראה אותנטי -->
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Heebo:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ספרייה לצילום המסך -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            var(--wood-frame): #5C4033;
            --wood-frame-light: #8B5A2B;
            --cork-bg: #D2B48C;
            --cork-texture: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" opacity="0.15"><circle cx="10" cy="10" r="2" fill="%235C4033"/><circle cx="40" cy="30" r="3" fill="%235C4033"/><circle cx="20" cy="50" r="1.5" fill="%235C4033"/><circle cx="50" cy="10" r="2.5" fill="%238B5A2B"/><circle cx="10" cy="40" r="2" fill="%238B5A2B"/></svg>');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background-color: #e9ecef; display: flex; flex-direction: column; min-height: 100vh; }

        /* --- סרגל כלים --- */
        .toolbar {
            background-color: #2c3e50; color: white; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 100;
        }

        .toolbar h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; margin: 0; }
        .toolbar-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn {
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; gap: 8px; font-family: 'Heebo', sans-serif; transition: all 0.2s ease;
        }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #2980b9; }
        .btn-capture { background-color: #27ae60; color: white; font-size: 16px; padding: 12px 20px;}
        .btn-capture:hover:not(:disabled) { background-color: #2ecc71; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover:not(:disabled) { background-color: #c0392b; }

        /* --- אזור ההדבקה --- */
        .admin-area {
            background-color: white; padding: 25px; margin: 20px auto; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1200px; width: 95%;
        }
        .admin-area h3 { margin-bottom: 15px; color: #2c3e50; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        textarea#pasteArea {
            width: 100%; height: 80px; padding: 15px; border: 2px dashed #bdc3c7; border-radius: 8px; 
            font-size: 16px; margin-bottom: 15px; resize: vertical; background-color: #f8f9fa;
        }
        textarea#pasteArea:focus { border-color: #3498db; outline: none; background-color: #fff; }

        /* --- לוח התצוגה (The Board) --- */
        .export-wrapper {
            background-color: var(--cork-bg);
            background-image: var(--cork-texture);
            border: 25px solid #5C4033;
            border-image: linear-gradient(45deg, #5C4033, #8B5A2B) 1;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 15px 40px rgba(0,0,0,0.3);
            margin: 0 auto 40px auto;
            max-width: 1600px; /* רוחב גדול כדי להכיל הרבה פתקים */
            width: 95%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .board-title-container { text-align: center; padding: 40px 20px 20px 20px; position: relative; z-index: 2; }
        
        .board-title-input, .board-title-display {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 10px 40px;
            font-family: 'Amatic SC', cursive;
            font-size: 55px;
            font-weight: bold;
            color: #222;
            text-align: center;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            display: inline-block;
        }
        .board-title-input:focus { background: #fff; border-color: #3498db; outline: none; border-style: solid; }

        .board-date {
            font-family: 'Heebo', sans-serif; font-size: 20px; color: white; background-color: #e74c3c;
            padding: 8px 25px; border-radius: 25px; display: inline-block; margin-top: -20px;
            position: relative; z-index: 3; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-weight: bold;
        }

        .board-grid {
            padding: 40px 50px 70px 50px;
            display: grid;
            /* הגדרה שמאפשרת לפתקים להסתדר יפה בלי קשר לרוחב המסך */
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 40px;
            align-items: start;
            min-height: 500px;
            flex-grow: 1;
        }

        .empty-state { text-align: center; color: rgba(92, 64, 51, 0.7); font-size: 28px; grid-column: 1 / -1; padding: 80px; font-weight: bold; }

        .board-footer {
            text-align: center; padding: 20px; font-family: 'Heebo', sans-serif; font-size: 20px;
            color: rgba(0,0,0,0.6); font-weight: bold; background: linear-gradient(to top, rgba(0,0,0,0.15), transparent);
        }

        /* --- פתקיות --- */
        .note {
            padding: 30px 25px 25px 25px; box-shadow: 4px 8px 18px rgba(0,0,0,0.25); position: relative;
            word-wrap: break-word; min-height: 200px; border-radius: 2px 15px 2px 15px;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 100%);
            transition: transform 0.2s;
        }
        .note:hover { transform: scale(1.02) !important; z-index: 10; box-shadow: 8px 15px 30px rgba(0,0,0,0.3); }

        .note-pin {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; 
            border-radius: 50%; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.4), inset 2px 2px 5px rgba(255,255,255,0.8), 3px 6px 8px rgba(0,0,0,0.5); z-index: 2;
        }

        .note::after {
            content: ''; position: absolute; bottom: 0; right: 0; border-width: 25px 25px 0 0;
            border-style: solid; border-color: rgba(0,0,0,0.1) #c2a781 rgba(0,0,0,0) rgba(0,0,0,0);
            display: block; width: 0; box-shadow: -3px -3px 5px rgba(0,0,0,0.1);
        }

        .note-header { font-family: 'Amatic SC', cursive; font-size: 38px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 10px; text-align: center; color: #111; line-height: 1; }
        .note-content { font-family: 'Kalam', cursive; font-size: 22px; line-height: 1.5; white-space: pre-wrap; color: #1a1a1a; }
        
        .delete-btn {
            position: absolute; top: -12px; right: -12px; background: white; border: none; color: #e74c3c;
            width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            cursor: pointer; opacity: 0; transition: 0.2s; font-size: 16px; z-index: 5;
        }
        .note:hover .delete-btn { opacity: 1; }

    </style>
</head>
<body>

    <div class="toolbar">
        <h1><i class="fas fa-camera-retro"></i> יוצר המזכרות הכיתתי</h1>
        <div class="toolbar-actions">
            <button class="btn btn-danger" onclick="clearBoard()">
                <i class="fas fa-trash-alt"></i> נקה לוח
            </button>
            <button class="btn btn-capture" id="captureBtn" onclick="captureFlawlessBoard()">
                <i class="fas fa-download"></i> הפק תמונה למזכרת
            </button>
        </div>
    </div>

    <div class="admin-area">
        <h3><i class="fab fa-whatsapp" style="color:#25D366;"></i> הדביקי כאן את ההודעות מהוואטסאפ:</h3>
        <textarea id="pasteArea" placeholder="העתיקי מוואטסאפ-ווב את ההודעות של התלמידים והדביקי כאן..."></textarea>
        <button class="btn btn-primary" onclick="processText()">
            <i class="fas fa-magic"></i> הוסף פתקים ללוח
        </button>
    </div>

    <!-- הלוח המוצג -->
    <div class="export-wrapper" id="exportWrapper">
        <div class="board-title-container">
            <input type="text" class="board-title-input" id="boardTitle" value="סיכום השבוע שלנו - כיתה ד'2!" placeholder="הקלידי כותרת ללוח...">
            <br>
            <div class="board-date" id="displayDate"></div>
        </div>
        <div class="board-grid" id="boardGrid"></div>
        <div class="board-footer">נוצר באהבה 💖 סיכום שבועי</div>
    </div>

    <script>
        let notesArray = [];
        const pinColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22'];

        window.onload = () => {
            document.getElementById('displayDate').textContent = new Date().toLocaleDateString('he-IL');
            const saved = localStorage.getItem('class_notes_v3');
            const savedTitle = localStorage.getItem('board_title_v3');
            
            if(savedTitle) document.getElementById('boardTitle').value = savedTitle;
            if(saved) { notesArray = JSON.parse(saved); renderBoard(); }
            else { renderBoard(); }

            document.getElementById('boardTitle').addEventListener('input', (e) => {
                localStorage.setItem('board_title_v3', e.target.value);
            });
        }

        function processText() {
            const text = document.getElementById('pasteArea').value;
            if(!text.trim()) return alert("התיבה ריקה. הדביקי טקסט תחילה.");

            const blocks = text.split('🌟 הפתק שלי 🌟');
            let addedCount = 0;

            blocks.forEach(block => {
                if(!block.trim()) return;

                const nameMatch = block.match(/שם:\s*([^\n]+)/);
                const colorMatch = block.match(/צבע:\s*(#[0-9a-fA-F]{3,6})/i);
                const contentMatch = block.match(/תוכן:\s*([\s\S]+)/);

                if(nameMatch && contentMatch) {
                    let content = contentMatch[1].trim();
                    content = content.replace(/\d{1,2}:\d{2}.*/g, '').trim();

                    notesArray.push({
                        id: Date.now() + Math.random(),
                        studentName: nameMatch[1].trim(),
                        color: colorMatch ? colorMatch[1] : '#fffacd',
                        content: content,
                        pinColor: pinColors[Math.floor(Math.random() * pinColors.length)]
                    });
                    addedCount++;
                }
            });

            if(addedCount > 0) {
                localStorage.setItem('class_notes_v3', JSON.stringify(notesArray));
                renderBoard();
                document.getElementById('pasteArea').value = ''; 
            } else {
                alert("לא נמצאו פתקים. ודאי שהעתקת הודעות תקינות מהוואטסאפ.");
            }
        }

        function renderBoard() {
            const board = document.getElementById('boardGrid');
            board.innerHTML = '';

            if(notesArray.length === 0) {
                board.innerHTML = '<div class="empty-state"><i class="fas fa-thumbtack" style="font-size:50px; margin-bottom:20px; color:#5C4033;"></i><br>הלוח ריק... מחכה לפתקים של התלמידים</div>';
                return;
            }

            notesArray.forEach(note => {
                const el = document.createElement('div');
                el.className = 'note';
                el.style.backgroundColor = note.color;
                
                // זווית קבועה לכל פתק כדי שלא ישתנה כל ריענון
                const angle = (parseFloat(note.id.toString().substring(10,13)) % 6) - 3;
                el.style.transform = `rotate(${angle}deg)`;

                el.innerHTML = `
                    <div class="note-pin" style="background-color: ${note.pinColor || '#e74c3c'};"></div>
                    <button class="delete-btn" onclick="deleteNote(${note.id})" title="מחק פתק"><i class="fas fa-times"></i></button>
                    <div class="note-header">${note.studentName}</div>
                    <div class="note-content">${note.content}</div>
                `;
                board.appendChild(el);
            });
        }

        window.deleteNote = function(id) {
            notesArray = notesArray.filter(n => n.id !== id);
            localStorage.setItem('class_notes_v3', JSON.stringify(notesArray));
            renderBoard();
        }

        window.clearBoard = function() {
            if(confirm("למחוק את כל הלוח ולהתחיל שבוע חדש?")) {
                notesArray = [];
                localStorage.setItem('class_notes_v3', JSON.stringify([]));
                renderBoard();
            }
        }

        // --- מנוע צילום חכם ומתקדם (למניעת חיתוך בתמונות ארוכות) ---
        window.captureFlawlessBoard = async function() {
            if(notesArray.length === 0) return alert("אין פתקים לצלם!");
            
            const btn = document.getElementById('captureBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מכין פוסטר HD (נא להמתין...)';
            btn.disabled = true;

            try {
                // הבטחה שהפונטים נטענו כדי למנוע טקסט שבור בתמונה
                await document.fonts.ready;

                const originalBoard = document.getElementById('exportWrapper');
                
                // שלב 1: יצירת תאום מדויק (Clone) של הלוח כדי שנוכל לעצב אותו לצילום בלי להרוס את המסך למורה
                const clone = originalBoard.cloneNode(true);
                
                // שלב 2: הגדרות חובה להדפסה מושלמת - כפיית רוחב של "פוסטר"
                clone.style.width = '1800px'; // רוחב קבוע גדול
                clone.style.maxWidth = 'none';
                clone.style.height = 'auto'; // גובה גמיש לפי כמות הפתקים (זה מה שמונע חיתוך!)
                clone.style.position = 'absolute';
                clone.style.top = '-9999px'; // הסתרת הכפיל מהעין של המשתמש
                clone.style.left = '0';
                clone.style.overflow = 'visible';
                clone.style.margin = '0';

                // שלב 3: הסרת כל כפתורי המחיקה (האיקסים) מהעותק
                const deleteBtns = clone.querySelectorAll('.delete-btn');
                deleteBtns.forEach(b => b.remove());

                // שלב 4: המרת שדה העריכה (input) לטקסט רגיל כדי שיראה כמו שלט טבעי
                const titleInput = clone.querySelector('.board-title-input');
                const titleDiv = document.createElement('div');
                titleDiv.className = 'board-title-display';
                titleDiv.style.border = 'none';
                titleDiv.style.background = 'rgba(255,255,255,0.85)';
                titleDiv.textContent = document.getElementById('boardTitle').value;
                titleInput.parentNode.replaceChild(titleDiv, titleInput);

                // הוספת העותק לדף (חובה כדי ש-html2canvas יראה אותו)
                document.body.appendChild(clone);

                // המתנה קצרה כדי לתת לדפדפן זמן לרנדר את העותק הענק שיצרנו
                await new Promise(r => setTimeout(r, 800));

                // שלב 5: הצילום עצמו!
                const canvas = await html2canvas(clone, {
                    scale: 1.5, // סקייל של 1.5 לרוחב 1800 נותן תמונה עצומה וחדה (2700 פיקסלים רוחב)
                    useCORS: true,
                    backgroundColor: '#D2B48C',
                    windowWidth: 1800, // מכריח את הקנבס לחשוב שהמסך רחב
                    logging: false
                });

                // שלב 6: הורדת התמונה
                const link = document.createElement('a');
                const safeTitle = document.getElementById('boardTitle').value.replace(/[^א-תa-zA-Z0-9]/g, '_') || 'סיכום_שבועי';
                link.download = `מזכרת_${safeTitle}.jpg`;
                // שמירה כ-JPG באיכות 90% חוסכת במשקל הקובץ (רלוונטי לווטסאפ) ועדיין שומרת על חדות
                link.href = canvas.toDataURL("image/jpeg", 0.90);
                link.click();

                // שלב 7: ניקיון מחיקת העותק
                document.body.removeChild(clone);

            } catch (err) {
                console.error("שגיאה בהפקת התמונה:", err);
                alert("אירעה שגיאה. נסי שוב.");
            } finally {
                // החזרת הכפתור למצבו הרגיל
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
